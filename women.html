<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Womenswear - Threads</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>

<body>
    <div class="grid-container">
        
        <!-- Header -->
        <header id="header-container"></header>

        <main class="men-page">

            <!-- DARK OVERLAY -->
            <div id="filterOverlay" class="filter-overlay"></div>

            <!-- TOP BAR -->
            <div class="men-topbar">
                <div class="men-filter">
                    <button id="filterBtn">Filter
                        <i class="fa-solid fa-list-ul"></i>
                    </button>
                </div>

                <div class="men-sort">
                    <select id="sortSelect">
                        <option value="featured">Default Sorting</option>
                        <option value="priceLow">Price: Low to High</option>
                        <option value="priceHigh">Price: High to Low</option>
                        <option value="nameAZ">A → Z</option>
                        <option value="nameZA">Z → A</option>
                    </select>
                </div>
            </div>

            <!-- FILTER DRAWER -->
            <div id="filterPanel" class="filter-panel">
                <h3>Filters</h3>

                <label class="filter-check">
                    <input type="checkbox" id="inStockOnly">
                    In Stock
                </label>

                <h4>Category</h4>
                <ul class="filter-category">
                    <li data-cat="all" class="active">All</li>
                    <li data-cat="tee">T-Shirts</li>
                    <li data-cat="outwear">OuterWear</li>
                    <li data-cat="top">Tops & Shirts</li>
                    <li data-cat="bottom">Bottoms</li>
                    <li data-cat="dress">Dresses</li>
                    <li data-cat="cap">Caps</li>
                </ul>

                <button id="closeFilter" class="close-filter-btn">Close</button>
            </div>

            <!-- PRODUCT GRID -->
            <div id="menGrid" class="men-grid"></div>

        </main>

       <!-- Footer -->
       <footer id="footer-container"></footer>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/chatbot.js"></script>
    <script src="components/women.js"></script>

</body>
</html>
